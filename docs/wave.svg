  <style>
    .vb { fill: url(#vabar); transform-box: fill-box; transform-origin: center bottom; animation: vaeq 1.6s ease-in-out infinite; opacity: .95; }
    .vg { animation: vafloat 9s ease-in-out infinite; }
    .vi { animation: vapulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center center; }
    .vh { animation: vahalo 3.2s ease-in-out infinite; }
    @keyframes vaeq { 0%, 100% { transform: scaleY(.16); } 50% { transform: scaleY(1); } }
    @keyframes vafloat { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(18px, -12px); } }
    @keyframes vapulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes vahalo { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .vb, .vg, .vi, .vh { animation: none; } }
  </style>
